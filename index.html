<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; padding: 10px;">
    <div class="form-container" style="border:solid; height: 50vh; width: 400px; padding: 8px; background-color: rgba(234, 113, 153, 0.733);">
        <form action="">
            <label for="name">Enter your name :</label>
            <input type="text" placeholder="User Name" required><br><br>

            <label for="email">Enter your email address :</label>
            <input type="email" placeholder="User e-mail" required> <br><br>
            <label for="name">Password:</label>
            <input type="text" id="name" placeholder="Enter password"><br>
            <p>Gender:</p>
                <input type="radio" name="Gender" id="Gender" value="Male">Male <br>
                <input type="radio" name="Gender" id="Gender" value="Female">Female
            <p>
                Choose course:
            </p>
            <p> 
                <select name="courses" id="id0" required>
                    <option value="">--Select your department--</option>
                    <option value="CSE">Computer Science & Engineering</option>
                    <option value="ECE">Electronics & Communications Engineering</option>
                    <option value="EE">Electrical Engineering</option>
                    <option value="CE">Civil Engineering</option>
                    <option value="ME">Mechanical Engineering</option>
                </select>
            </p>
            <div class="btns">
                <button type="submit">Submit</button>
                <button type="reset">Clear form</button>
            </div>
        </form>
    </div>
    
</body>
</html>
